<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="t d">
<title id="t">Diferença entre ERP e MES na fábrica pequena</title>
<desc id="d">Ilustração da diferença entre ERP e MES. À esquerda, a retaguarda (ERP): financeiro, nota fiscal e impostos, compras, faturamento e cobrança. À direita, o chão de fábrica (MES, sistema de controle de produção): fila por setor, status atualizado pelo operador, alerta de material. O pedido passa entre os dois: entra aprovado na produção e volta concluído para ser faturado no ERP.</desc>
<rect width="640" height="470" rx="14" fill="#f7f5f0"/>
<rect x="24" y="24" width="250" height="330" rx="12" fill="#fffdf9" stroke="#d9dee4" stroke-width="2"/>
<rect x="24" y="24" width="250" height="74" rx="12" fill="#0f2a43"/>
<rect x="24" y="80" width="250" height="18" fill="#0f2a43"/>
<text x="44" y="56" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start">Retaguarda (ERP)</text>
<text x="44" y="82" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start">ERP · o lugar do dinheiro</text>
<circle cx="54" cy="134" r="7" fill="#0f2a43"/>
<text x="72" y="140" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1d2b38" text-anchor="start">Financeiro</text>
<text x="72" y="164" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#556474" text-anchor="start">pagar e receber, caixa</text>
<circle cx="54" cy="210" r="7" fill="#0f2a43"/>
<text x="72" y="216" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1d2b38" text-anchor="start">Fiscal</text>
<text x="72" y="240" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#556474" text-anchor="start">nota fiscal e impostos</text>
<circle cx="54" cy="286" r="7" fill="#0f2a43"/>
<text x="72" y="292" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1d2b38" text-anchor="start">Compras</text>
<text x="72" y="316" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#556474" text-anchor="start">faturamento e cobrança</text>
<rect x="366" y="24" width="250" height="330" rx="12" fill="#fffdf9" stroke="#d9dee4" stroke-width="2"/>
<rect x="366" y="24" width="250" height="74" rx="12" fill="#c97412"/>
<rect x="366" y="80" width="250" height="18" fill="#c97412"/>
<text x="386" y="56" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start">Chão de fábrica</text>
<text x="386" y="82" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start">MES · o lugar da produção</text>
<circle cx="396" cy="134" r="7" fill="#c97412"/>
<text x="414" y="140" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1d2b38" text-anchor="start">Fila por setor</text>
<text x="414" y="164" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#556474" text-anchor="start">prioridade visível</text>
<circle cx="396" cy="210" r="7" fill="#c97412"/>
<text x="414" y="216" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1d2b38" text-anchor="start">Status pelo operador</text>
<text x="414" y="240" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#556474" text-anchor="start">atualizado no posto</text>
<circle cx="396" cy="286" r="7" fill="#c97412"/>
<text x="414" y="292" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1d2b38" text-anchor="start">Alerta de material</text>
<text x="414" y="316" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#556474" text-anchor="start">antes de faltar</text>
<path d="M282 160 L352 160 M342 151 L354 160 L342 169" stroke="#25a35a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="146" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#25a35a" text-anchor="middle">aprovado</text>
<path d="M352 236 L282 236 M292 227 L280 236 L292 245" stroke="#556474" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="262" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#556474" text-anchor="middle">concluído</text>
<text x="320" y="280" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#556474" text-anchor="middle">→ faturar</text>
<rect x="24" y="374" width="592" height="72" rx="12" fill="#fffdf9" stroke="#d9dee4" stroke-width="2"/>
<text x="48" y="404" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1d2b38" text-anchor="start">O mesmo número de pedido nos dois</text>
<text x="48" y="430" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#556474" text-anchor="start">liga a retaguarda ao chão de fábrica sem trocar o que já funciona.</text>
</svg>
