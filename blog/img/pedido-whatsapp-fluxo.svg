<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 594" role="img" aria-labelledby="t d">
<title id="t">Fluxo do pedido do WhatsApp até a produção</title>
<desc id="d">1. Receber: cliente pede pelo WhatsApp; 2. Registrar: pedido completo, em um só lugar; 3. Confirmar: resumo + “CONFIRMO” por escrito; 4. Cobrar: pagamento e comprovante anexado; 5. Aprovar: gestor libera para a produção; 6. Avisar: cliente recebe cada etapa.</desc>
